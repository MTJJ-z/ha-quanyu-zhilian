ir_search:
  name: 本地红外库搜索
  description: 离线搜索随集成安装的完整 Flipper-IRDB 快照，返回分页结果和来源版本。
  fields:
    query:
      name: 品牌或型号关键词
      example: TCL
      selector:
        text:
    category:
      name: 分类（可选）
      example: ACs
      selector:
        text:
    limit:
      name: 每页条数
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: box
    offset:
      name: 跳过条数
      default: 0
      selector:
        number:
          min: 0
          mode: box
ir_inspect:
  name: 查看本地红外遥控器
  description: 返回遥控器全部按键、索引和当前 CYD 固件的发送兼容限制。
  fields:
    profile_id:
      name: 遥控器 ID（搜索结果中的 id）
      required: true
      selector:
        text:
ir_gateways:
  name: 列出红外网关
  description: 返回已配置的全域智联网关及其红外发送能力。
ir_send:
  name: 发送本地红外库按键
  description: 从本地库读取并通过指定网关发送一次；支持的解析协议使用协议编码器，其他格式仅在原始波形可安全传输时发送。
  fields:
    gateway_id:
      name: 网关 ID
      required: true
      selector:
        text:
    profile_id:
      name: 遥控器 ID
      required: true
      selector:
        text:
    signal_index:
      name: 按键索引（从 0 开始）
      required: true
      selector:
        number:
          min: 0
          mode: box
execute:
  name: Execute component command
  description: Execute a command advertised by the selected CYD component.
  fields:
    gateway_id:
      name: Gateway ID
      description: The configured CYD gateway identifier.
      required: true
      example: cyd_08a570f3af48
      selector:
        text:
    component_id:
      name: Component ID
      description: Component identifier from the firmware discovery descriptor.
      required: true
      example: ir.transmitter
      selector:
        text:
    command_id:
      name: Command ID
      description: Command identifier advertised by that component.
      required: true
      example: send_raw
      selector:
        text:
    parameters:
      name: Parameters
      description: Object containing values declared by the command descriptor.
      required: false
      selector:
        object:
